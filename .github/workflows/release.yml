---
# Tags a release on request: Actions -> Release -> Run workflow. The version is
# optional -- left empty it is the newest vX.Y.Z tag with one added to the patch
# number, which is what a release usually is; type one only when it is not (a
# new minor, a first release). It writes that version into _meta.lua (which is
# where the AppStore plugin reads it from, by a plain text match on the file),
# tags the commit, and publishes lardo.koplugin.zip as a release asset -- the
# shape the AppStore recognises as "a plugin directory", so installing takes the
# asset rather than a zipball of the whole repository.
#
# Nothing is tagged that does not pass the test suite; "dry run" does
# everything but the pushing, which is how to try it the first time.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 (empty: the last tag, patch + 1)"
        required: false
        type: string
      notes:
        description: "A line or two for the release notes (optional)"
        required: false
        type: string
      dry_run:
        description: "Build and test, but do not push the tag or release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need the tags to refuse a version twice

      # Inputs go through the environment, never into a script through ${{ }}:
      # what someone types into the dispatch form would otherwise be pasted
      # into the shell.
      - name: Work out the version
        id: version
        env:
          GIVEN: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "$GIVEN" ]; then
              printf '%s\n' "$GIVEN" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
                  echo "::error::\"$GIVEN\" is not a version like 1.2.3" >&2
                  exit 1
              }
              version=$GIVEN
          else
              # Newest first, by version rather than alphabetically (v10 > v9),
              # and only tags that are versions -- anything else named v* is not
              # something to count up from.
              last=$(git tag --list 'v*' --sort=-v:refname \
                  | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
              if [ -z "$last" ]; then
                  version=0.1.0
                  echo "No version tag yet, starting at v$version"
              else
                  rest=${last#v}
                  major=${rest%%.*}
                  rest=${rest#*.}
                  minor=${rest%%.*}
                  patch=${rest#*.}
                  version="$major.$minor.$((patch + 1))"
                  echo "No version given: $last -> v$version"
              fi
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version is already tagged" >&2
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **v$version**" >> "$GITHUB_STEP_SUMMARY"

      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends luajit

      - name: Run the tests
        run: LUA=$(command -v luajit) tests/run.sh

      # The AppStore reads the version straight out of the file
      # (`version%s*=%s*["']([^"']+)["']`), so it has to be a plain string
      # literal -- and it has to be in the commit the tag points at.
      - name: Write the version into _meta.lua
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          meta=lardo.koplugin/_meta.lua
          if grep -qE '^[[:space:]]*version[[:space:]]*=' "$meta"; then
              sed -i -E "s|^([[:space:]]*)version[[:space:]]*=.*|\1version = \"$VERSION\",|" "$meta"
          else
              sed -i -E "s|^([[:space:]]*)name[[:space:]]*=.*|&\n\1version = \"$VERSION\",|" "$meta"
          fi
          grep -qF "version = \"$VERSION\"," "$meta" || {
              echo "::error::could not set the version in $meta" >&2
              exit 1
          }
          # it is still Lua, and PluginLoader drops a plugin whose _meta.lua
          # does not parse -- without saying so anywhere a user would look
          luajit -e "local f, e = loadfile('$meta') assert(f, e)"
          cat "$meta"

      - name: Build lardo.koplugin.zip
        run: zip -r lardo.koplugin.zip lardo.koplugin -x '*.DS_Store'

      - name: Tag it
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lardo.koplugin/_meta.lua
          git diff --cached --quiet || git commit -m "Lardo v$VERSION"
          git tag -a "v$VERSION" -m "Lardo v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$VERSION"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          {
              if [ -n "$NOTES" ]; then
                  printf '%s\n\n' "$NOTES"
              fi
              printf 'Copy `lardo.koplugin/` from the attached zip into `koreader/plugins/`,\n'
              printf 'or install it from the KOReader AppStore plugin.\n'
          } > release-notes.md
          gh release create "v$VERSION" lardo.koplugin.zip \
              --title "Lardo v$VERSION" \
              --notes-file release-notes.md \
              --generate-notes

      - name: What a dry run would have done
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          echo "Tests pass; v$VERSION would be tagged and released with:"
          unzip -l lardo.koplugin.zip
