---
# Tags a release on request: Actions -> Release -> Run workflow, give it a
# version. It writes that version into _meta.lua (which is where the AppStore
# plugin reads it from, by a plain text match on the file), tags the commit,
# and publishes lardo.koplugin.zip as a release asset -- the shape the AppStore
# recognises as "a plugin directory", so installing takes the asset rather than
# a zipball of the whole repository.
#
# Nothing is tagged that does not pass the test suite; "dry run" does
# everything but the pushing, which is how to try it the first time.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (no leading v)"
        required: true
        type: string
      notes:
        description: "A line or two for the release notes (optional)"
        required: false
        type: string
      dry_run:
        description: "Build and test, but do not push the tag or release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need the tags to refuse a version twice

      # Inputs go through the environment, never into a script through ${{ }}:
      # what someone types into the dispatch form would otherwise be pasted
      # into the shell.
      - name: Check the version and that it is new
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::\"$VERSION\" is not a version like 1.2.3" >&2
              exit 1
          }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::v$VERSION is already tagged" >&2
              exit 1
          fi

      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends luajit

      - name: Run the tests
        run: LUA=$(command -v luajit) tests/run.sh

      # The AppStore reads the version straight out of the file
      # (`version%s*=%s*["']([^"']+)["']`), so it has to be a plain string
      # literal -- and it has to be in the commit the tag points at.
      - name: Write the version into _meta.lua
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          meta=lardo.koplugin/_meta.lua
          if grep -qE '^[[:space:]]*version[[:space:]]*=' "$meta"; then
              sed -i -E "s|^([[:space:]]*)version[[:space:]]*=.*|\1version = \"$VERSION\",|" "$meta"
          else
              sed -i -E "s|^([[:space:]]*)name[[:space:]]*=.*|&\n\1version = \"$VERSION\",|" "$meta"
          fi
          grep -qF "version = \"$VERSION\"," "$meta" || {
              echo "::error::could not set the version in $meta" >&2
              exit 1
          }
          # it is still Lua, and PluginLoader drops a plugin whose _meta.lua
          # does not parse -- without saying so anywhere a user would look
          luajit -e "local f, e = loadfile('$meta') assert(f, e)"
          cat "$meta"

      - name: Build lardo.koplugin.zip
        run: zip -r lardo.koplugin.zip lardo.koplugin -x '*.DS_Store'

      - name: Tag it
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lardo.koplugin/_meta.lua
          git diff --cached --quiet || git commit -m "Lardo v$VERSION"
          git tag -a "v$VERSION" -m "Lardo v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$VERSION"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          {
              if [ -n "$NOTES" ]; then
                  printf '%s\n\n' "$NOTES"
              fi
              printf 'Copy `lardo.koplugin/` from the attached zip into `koreader/plugins/`,\n'
              printf 'or install it from the KOReader AppStore plugin.\n'
          } > release-notes.md
          gh release create "v$VERSION" lardo.koplugin.zip \
              --title "Lardo v$VERSION" \
              --notes-file release-notes.md \
              --generate-notes

      - name: What a dry run would have done
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "Tests pass; v$VERSION would be tagged and released with:"
          unzip -l lardo.koplugin.zip
